<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Merco Geopolímeros — Central de Propostas</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="CRM da Merco Geopolímeros — Acesse sua conta e acompanhe clientes, propostas e projetos." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <meta name="author" content="Skip (https://goskip.dev)" />
    <meta property="og:image" content="/og-image.png" />
    <script>
      // Aplica o tema salvo antes do primeiro desenho (evita piscar claro→escuro).
      try {
        var mgTheme = localStorage.getItem('mg-theme') || 'system'
        var mgDark = mgTheme === 'dark' || (mgTheme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (mgDark) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <!-- @skip-protected: Do not remove. Required for app features. -->

  </body>
